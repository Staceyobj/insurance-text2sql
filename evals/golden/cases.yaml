# Golden set — 42 cases (SPEC §6.1). RED LINE: expected_sql must never be
# modified to make an evaluation pass; any legitimate revision needs its own
# commit with explicit justification.
# Constraints: absolute dates only in sql questions; every result set must be
# bounded (<= ROW_LIMIT); ordered: true only where row order is part of the
# question (TopN). Case ids sort stably: clarify-* < refuse-* < sql-*.

