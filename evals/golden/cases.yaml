# ---------------------------------------------------------------- sql (30)
# 单表筛选 / 计数 ×4（含 1 英文）
- id: sql-001
  category: sql
  question: 2024年生效的保单有多少张？
  expected_sql: SELECT count(*) FROM policies WHERE effective_date >= DATE '2024-01-01' AND effective_date < DATE '2025-01-01'
- id: sql-002
  category: sql
  question: How many policies became effective in 2023?
  expected_sql: SELECT count(*) FROM policies WHERE effective_date >= DATE '2023-01-01' AND effective_date < DATE '2024-01-01'
- id: sql-003
  category: sql
  question: 目前状态为有效（in_force）的保单有多少张？
  expected_sql: SELECT count(*) FROM policies WHERE status = 'in_force'
- id: sql-004
  category: sql
  question: 保障期为终身（term_years 为 0）的寿险产品有多少个？
  expected_sql: SELECT count(*) FROM products WHERE category = 'life' AND term_years = 0

# 聚合 SUM/AVG/MIN/MAX ×5（含 2 英文）
- id: sql-005
  category: sql
  question: 2024年生效保单的平均年缴保费是多少？
  expected_sql: SELECT avg(annual_premium) FROM policies WHERE effective_date >= DATE '2024-01-01' AND effective_date < DATE '2025-01-01'
- id: sql-006
  category: sql
  question: What was the total claimed amount for claims filed in 2023?
  expected_sql: SELECT sum(claimed_amount) FROM claims WHERE filed_date >= DATE '2023-01-01' AND filed_date < DATE '2024-01-01'
- id: sql-007
  category: sql
  question: 2025年生效保单的最高保额是多少？
  expected_sql: SELECT max(sum_assured) FROM policies WHERE effective_date >= DATE '2025-01-01' AND effective_date < DATE '2026-01-01'
- id: sql-008
  category: sql
  question: What was the minimum annual premium among policies that became effective in 2025?
  expected_sql: SELECT min(annual_premium) FROM policies WHERE effective_date >= DATE '2025-01-01' AND effective_date < DATE '2026-01-01'
- id: sql-009
  category: sql
  question: 所有保单的保额总和是多少？
  expected_sql: SELECT sum(sum_assured) FROM policies

# GROUP BY ×3
- id: sql-010
  category: sql
  question: 各城市的客户数量分别是多少？
  expected_sql: SELECT city, count(*) FROM customers GROUP BY city
- id: sql-011
  category: sql
  question: 各风险等级（risk_level）的客户数量分别是多少？
  expected_sql: SELECT risk_level, count(*) FROM customers GROUP BY risk_level
- id: sql-012
  category: sql
  question: 各种状态（status）的保单数量分别是多少？
  expected_sql: SELECT status, count(*) FROM policies GROUP BY status

# HAVING ×2
- id: sql-013
  category: sql
  question: 客户数量超过42名的城市有哪些？
  expected_sql: SELECT city FROM customers GROUP BY city HAVING count(*) > 42
- id: sql-014
  category: sql
  question: 2024年生效保单数量超过20张的代理人ID（agent_id）有哪些？
  expected_sql: SELECT agent_id FROM policies WHERE effective_date >= DATE '2024-01-01' AND effective_date < DATE '2025-01-01' GROUP BY agent_id HAVING count(*) > 20

# 排序 TopN ×3（ordered: true）
- id: sql-015
  category: sql
  question: 2024年申请理赔金额最高的前5笔理赔的理赔号（claim_no）和申请金额
  expected_sql: SELECT claim_no, claimed_amount FROM claims WHERE filed_date >= DATE '2024-01-01' AND filed_date < DATE '2025-01-01' ORDER BY claimed_amount DESC LIMIT 5
  ordered: true
- id: sql-016
  category: sql
  question: 2024年签单年缴保费总额最高的前3名代理人的ID（agent_id）和总额
  expected_sql: SELECT agent_id, sum(annual_premium) AS total_premium FROM policies WHERE effective_date >= DATE '2024-01-01' AND effective_date < DATE '2025-01-01' GROUP BY agent_id ORDER BY total_premium DESC LIMIT 3
  ordered: true
- id: sql-017
  category: sql
  question: 2023年理赔申请总额前三的产品类别（category）和总额
  expected_sql: SELECT p.category, sum(c.claimed_amount) AS total_claimed FROM claims c JOIN policies po ON po.policy_id = c.policy_id JOIN products p ON p.product_id = po.product_id WHERE c.filed_date >= DATE '2023-01-01' AND c.filed_date < DATE '2024-01-01' GROUP BY p.category ORDER BY total_claimed DESC LIMIT 3
  ordered: true

# 绝对时间区间 ×3
- id: sql-018
  category: sql
  question: 2024年3月至6月（含）生效的保单有多少张？
  expected_sql: SELECT count(*) FROM policies WHERE effective_date >= DATE '2024-03-01' AND effective_date < DATE '2024-07-01'
- id: sql-019
  category: sql
  question: 2025年上半年申请的理赔有多少件？
  expected_sql: SELECT count(*) FROM claims WHERE filed_date >= DATE '2025-01-01' AND filed_date < DATE '2025-07-01'
- id: sql-020
  category: sql
  question: 2024年第一季度应缴且状态为已缴（paid）的缴费记录有多少条？
  expected_sql: SELECT count(*) FROM payments WHERE due_date >= DATE '2024-01-01' AND due_date < DATE '2024-04-01' AND status = 'paid'

# 两表 JOIN ×3
- id: sql-021
  category: sql
  question: 2024年生效、客户风险等级为高（high）的保单有多少张？
  expected_sql: SELECT count(*) FROM policies po JOIN customers c ON c.customer_id = po.customer_id WHERE c.risk_level = 'high' AND po.effective_date >= DATE '2024-01-01' AND po.effective_date < DATE '2025-01-01'
- id: sql-022
  category: sql
  question: 杭州分公司的代理人在2024年签了多少张保单？
  expected_sql: SELECT count(*) FROM policies po JOIN agents a ON a.agent_id = po.agent_id WHERE a.branch_city = '杭州' AND po.effective_date >= DATE '2024-01-01' AND po.effective_date < DATE '2025-01-01'
- id: sql-023
  category: sql
  question: 2024年生效的医疗险（medical）保单的平均保额是多少？
  expected_sql: SELECT avg(po.sum_assured) FROM policies po JOIN products p ON p.product_id = po.product_id WHERE p.category = 'medical' AND po.effective_date >= DATE '2024-01-01' AND po.effective_date < DATE '2025-01-01'

# 三表 JOIN ×3
- id: sql-024
  category: sql
  question: 2024年各产品类别的理赔申请总额分别是多少？
  expected_sql: SELECT p.category, sum(c.claimed_amount) FROM claims c JOIN policies po ON po.policy_id = c.policy_id JOIN products p ON p.product_id = po.product_id WHERE c.filed_date >= DATE '2024-01-01' AND c.filed_date < DATE '2025-01-01' GROUP BY p.category
- id: sql-025
  category: sql
  question: 2024年杭州城市客户的理赔申请总金额是多少？
  expected_sql: SELECT sum(c.claimed_amount) FROM claims c JOIN policies po ON po.policy_id = c.policy_id JOIN customers cu ON cu.customer_id = po.customer_id WHERE cu.city = '杭州' AND c.filed_date >= DATE '2024-01-01' AND c.filed_date < DATE '2025-01-01'
- id: sql-026
  category: sql
  question: 2024年高风险客户通过银行转账方式实际缴纳的总金额是多少？
  expected_sql: SELECT sum(pay.amount) FROM payments pay JOIN policies po ON po.policy_id = pay.policy_id JOIN customers cu ON cu.customer_id = po.customer_id WHERE cu.risk_level = 'high' AND pay.method = 'bank_transfer' AND pay.paid_date >= DATE '2024-01-01' AND pay.paid_date < DATE '2025-01-01'

# 去重计数 ×2（含 1 英文）
- id: sql-027
  category: sql
  question: 2024年提出过理赔申请的客户去重后有多少名？
  expected_sql: SELECT count(DISTINCT po.customer_id) FROM claims c JOIN policies po ON po.policy_id = c.policy_id WHERE c.filed_date >= DATE '2024-01-01' AND c.filed_date < DATE '2025-01-01'
- id: sql-028
  category: sql
  question: How many distinct agents sold medical policies effective in 2024?
  expected_sql: SELECT count(DISTINCT po.agent_id) FROM policies po JOIN products p ON p.product_id = po.product_id WHERE p.category = 'medical' AND po.effective_date >= DATE '2024-01-01' AND po.effective_date < DATE '2025-01-01'

# 比值计算 ×2
- id: sql-029
  category: sql
  question: 2024年申请的理赔中，状态为已赔付（paid）的占比是多少？
  expected_sql: SELECT count(*) FILTER (WHERE status = 'paid')::numeric / count(*) FROM claims WHERE filed_date >= DATE '2024-01-01' AND filed_date < DATE '2025-01-01'
- id: sql-030
  category: sql
  question: 2024年应缴的缴费记录中，状态为逾期（overdue）的占比是多少？
  expected_sql: SELECT count(*) FILTER (WHERE status = 'overdue')::numeric / count(*) FROM payments WHERE due_date >= DATE '2024-01-01' AND due_date < DATE '2025-01-01'
