services:
  postgres:
    image: postgres:16
    container_name: insurance-text2sql-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
